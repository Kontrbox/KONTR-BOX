<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontrbox 0.1 — Официальная проверка</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0e121a; color: #e2e8f0; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 550px; width: 100%; background: #1a202c; padding: 25px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); box-sizing: border-box; border: 1px solid #2d3748; margin-top: 10px; }
        h1 { text-align: center; font-size: 26px; margin-bottom: 20px; color: #fff; text-transform: uppercase; letter-spacing: 1px; }
        .input-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
        input { padding: 16px; background: #2d3748; border: 2px solid #4a5568; border-radius: 8px; font-size: 16px; color: #fff; outline: none; text-align: center; font-weight: bold; width: 100%; box-sizing: border-box; }
        input:focus { border-color: #38a169; }
        
        /* Кнопки */
        .btn { text-align: center; display: block; background: #38a169; color: white; border: none; padding: 16px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; text-transform: uppercase; width: 100%; box-sizing: border-box; text-decoration: none; }
        .btn:hover { background: #2f855a; }
        #scan-label { background: #3182ce; }
        #scan-label:hover { background: #2b6cb0; }
        
        /* Скрытый инпут вызова камеры */
        #file-input { display: none; }

        /* Блоки вывода результатов */
        .result-box { margin-top: 20px; padding: 25px; border-radius: 12px; border: 2px solid transparent; display: block; }
        .success { border-color: #38a169; background: #1c4532; color: #fff; }
        .error { border-color: #e53e3e; background: #652b2b; color: #fed7d7; text-align: center; font-weight: bold; }
        
        .specs-list { padding-left: 20px; font-size: 15px; line-height: 1.7; color: #e2e8f0; }
        .specs-list b { color: #fff; }
        h2, h3, h4 { color: #fff; margin-top: 25px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🛡️ KONTRBOX VERIFY</h1>
    
    <div class="input-group">
        <!-- Кнопка сканера вызывает системную камеру -->
        <label for="file-input" id="scan-label" class="btn">📷 Включить сканер штрих-кода</label>
        <input type="file" id="file-input" accept="image/*" capture="environment">
        
        <input type="text" id="serial-input" placeholder="ВВЕДИТЕ СЕРИЙНЫЙ НОМЕР КОЛОНКИ">
        
        <!-- Кнопка проверки подлинности -->
        <button class="btn" onclick="runVerification()">Проверить подлинность</button>
    </div>

    <!-- Блок, куда скрипт выведет спецификацию колонки -->
    <div id="result-container"></div>
</div>

<!-- ВОТ ЭТОТ СКРИПТ, КОТОРОГО У ТЕБЯ НЕ БЫЛО. ОН ОЖИВЛЯЕТ ВСЕ КНОПКИ -->
<script>
// Логика кнопки сканера
document.getElementById('file-input').addEventListener('change', function(e) {
    if (e.target.files && e.target.files[0]) {
        // Системное уведомление, что снимок получен браузером
        alert("Фото успешно загружено! Введите ваш номер 8602095001 вручную в поле для вывода полной спецификации.");
    }
});

// Логика кнопки "Проверить подлинность"
function runVerification() {
    var serialNumber = document.getElementById('serial-input').value.trim();
    var resultContainer = document.getElementById('result-container');
    
    if (serialNumber === "") {
        alert("Пожалуйста, введите серийный номер колонки!");
        return;
    }

    // Проверка твоего серийника
    if (serialNumber === "8602095001") {
        resultContainer.innerHTML = `
            <div class="result-box success">
<p style="text-align: center; font-size: 16px;"><b>🟢 Статус: Оригинальный продукт Kontrbox</b></p>
                
                <p style="font-size: 15px; line-height: 1.6; text-align: justify; margin-bottom: 20px;"> 
                    Аудиосистема с указанным серийным номером является официальным оригиналом. Она полностью собрана по инженерным стандартам компании, прошла жесткий технический контроль звука и находится на фирменной гарантии.
                </p>
                
                <div style="background: #2d3748; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #4a5568;">
                    <p style="margin: 5px 0;"><b>Модель:</b> Контрбокс 0.1 (Kontrbox 0.1)</p>
                    <p style="margin: 5px 0;"><b>Серийный номер:</b> <span style="color: #48bb78; font-weight: bold;">${serialNumber}</span></p>
                    <p style="margin: 5px 0;"><b>Статус устройства:</b> Активно / Зарегистрировано в единой базе</p>
                    <p style="margin: 5px 0;"><b>Поддержка:</b> Доступно полное техническое сопровождение и гарантия</p>
                </div>

                <h3>📊 Полный лист технических характеристик</h3>
                
                <h4>📐 Корпус и габариты</h4>
                <ul class="specs-list">
                    <li><b>Форм-фактор:</b> Тяжелая премиальная аудиосистема 2.1</li>
                    <li><b>Длина (Глубина):</b> 380 мм</li>
                    <li><b>Ширина:</b> 200 мм</li>
                    <li><b>Высота:</b> 200 мм</li>
                    <li><b>Общий объем корпуса:</b> 15.2 литра</li>
                    <li><b>Тип сборки:</b> Кастомная инженерная конструкция с жестким демпфированием</li>
                    <li><b>Материал корпуса:</b> Сделано из дерева ✅</li>
                </ul>

                <h4>🔊 Реальная звуковая мощность</h4>
                <ul class="specs-list">
                    <li><b>Номинальная чистая мощность:</b> 250 Вт RMS</li>
                    <li><b>Особенность звука:</b> Это честная, настоящая мощность аудиосистемы. Никаких завышенных «китайских» цифр на коробке. Колонка выдает плотный, пробивающий тело бас и кристально чистый звук без искажений даже на максимальной громкости.</li>
                    <li><b>Тип аудиосистемы:</b> Трехканальный True Sound (2.1)</li>
                    <li><b>Низкочастотный динамик (Сабвуфер):</b> Профессиональный тяжелый вуфер AIYIMA 5.25 дюймов (4 Ом)</li>
                    <li><b>Широкополосные динамики (Каналы R/L):</b> Два мощных динамика по 4 дюйма для идеальной детализации средних и высоких частот</li>
                </ul>

                <h4>🧠 Усилитель и управление</h4>
                <ul class="specs-list">
                    <li><b>Сердце системы:</b> Высокоэффективный цифровой усилитель ZK-HT21 на оригинальном мощном чипе TDA7498E</li>
                    <li><b>Беспроводная связь:</b> Bluetooth 5.0 (мгновенное подключение, стабильный сигнал, передача звука без потерь)</li>
                    <li><b>Проводное подключение:</b> Классический аудиовход AUX (3.5 мм) и USB-порт для воспроизведения музыки с флеш-карт</li>
                    <li><b>Аналоговая панель управления (Тонкая настройка):</b>
                        <br>• Регулятор частоты среза сабвуфера (Subwoofer Freq)
                        <br>• Регулятор индивидуальной громкости сабвуфера (Subwoofer Volume)
                        <br>• Регулятор высоких частот (Treble)
                        <br>• Регулятор низких частот (Bass)
                        <br>• Общий силовой регулятор громкости и питания (Main Volume)
                    </li>
                </ul>

                <h4>⚡ Электроника, питание и защита</h4>
                <ul class="specs-list">
                    <li><b>Энергетическая база:</b> Мощная аккумуляторная сборка повышенной емкости 6S (номинальное рабочее напряжение 22.2 В — 24 В)</li>
<li><b>Система умной защиты (BMS):</b> Плата 6S 40A 12mos (полный контроль от перезаряда, глубокого разряда и коротких замыканий)</li>
                    <li><b>Индикация заряда:</b> Встроенный в корпус ЖК-экран с сочной зеленой подсветкой. Показывает точный процент оставшейся емкости аккумулятора (6S)</li>
                    <li><b>Органы управления:</b> Премиальная металлическая антивандальная кнопка питания 22 мм с круговой светодиодной LED-подсветкой и фиксацией положения</li>
                    <li><b>Порт зарядки:</b> Усиленное металлическое гнездо питания DC 5.5 x 2.1 мм, жестко зафиксированное в корпусе</li>
                    <li><b>Зарядное устройство:</b> Фирменный сетевой адаптер Li-ion 25.2 В, 2А для быстрой и безопасной закачки энергии в батарею</li>
                </ul>
            </div>
        `;
    } else {
        // Ошибка при неверном номере
        resultContainer.innerHTML = `
            <div class="result-box error">
                ❌ Ошибка: Серийный номер не найден в базе данных!<br>
                <span style="font-weight: normal; font-size: 14px; display:block; margin-top: 10px;">
                    Убедитесь в правильности ввода или обратитесь в официальную техподдержку Kontrbox.
                </span>
            </div>
        `;
    }
}
</script>

</body>
</html>
