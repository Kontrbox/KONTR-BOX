<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontrbox 0.1 — Официальная проверка</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0e121a;
            color: #e2e8f0;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 550px;
            width: 100%;
            background: #1a202c;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            box-sizing: border-box;
            border: 1px solid #2d3748;
            margin-top: 10px;
        }
        h1 {
            text-align: center;
            font-size: 26px;
            margin-bottom: 20px;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        input {
            padding: 16px;
            background: #2d3748;
            border: 2px solid #4a5568;
            border-radius: 8px;
            font-size: 18px;
            color: #fff;
            outline: none;
            text-align: center;
            font-weight: bold;
            width: 100%;
            box-sizing: border-box;
            letter-spacing: 1px;
        }
        input:focus { border-color: #38a169; }

        .btn {
            text-align: center;
            display: block;
            background: #38a169;
            color: white;
            border: none;
            padding: 18px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
            width: 100%;
            box-sizing: border-box;
            text-decoration: none;
        }
        .btn:hover { background: #2f855a; }
        .btn-secondary { background: #4a5568; }
        .btn-secondary:hover { background: #718096; }

        .result-box {
            display: none;
            margin-top: 20px;
            padding: 25px;
            border-radius: 12px;
            border: 2px solid transparent;
        }
        .success {
            display: block;
            border-color: #38a169;
            background: #1c4532;
            color: #fff;
        }
        .error {
            display: block;
            border-color: #e53e3e;
            background: #652b2b;
            color: #fed7d7;
            text-align: center;
            font-weight: bold;
        }

        .specs-list {
            padding-left: 20px;
            font-size: 15px;
            line-height: 1.7;
            color: #e2e8f0;
            text-align: left;
        }
        .specs-list b { color: #fff; }
        .parts-title {
            margin-top: 25px;
            font-size: 18px;
            color: #fff;
            border-bottom: 1px solid #4a5568;
            padding-bottom: 8px;
            text-align: left;
        }
        .part-card {
            background: #2d3748;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border: 1px solid #4a5568;
            text-align: left;
        }
        .part-card img {
            width: 100%;
            max-height: 250px;
            object-fit: contain;
            border-radius: 8px;
            background: #252b36;
        }
        .part-link {
            display: inline-block;
            text-align: center;
            background: #4a5568;
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            transition: 0.2s;
        }
        .part-link:hover { background: #718096; }
        h2, h3, h4 {
            color: #fff;
            margin-top: 25px;
            margin-bottom: 10px;
            text-align: left;
        }

        /* ====== ПРОСТОЙ ПРИЦЕЛ ====== */
        #qr-reader {
            width: 100%;
            margin-top: 15px;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }
        #qr-reader video {
            width: 100% !important;
            display: block;
        }
        #qr-reader::after {
            content: "";
            position: absolute;
            inset: 10%;
            border: 4px solid #28a745;
            border-radius: 16px;
            box-shadow: 0 0 18px rgba(40, 167, 69, 0.6);
            pointer-events: none;
            z-index: 10;
        }
        #qr-reader::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            mask:
                linear-gradient(#000 0 0) content-box,
                linear-gradient(#000 0 0);
            -webkit-mask:
                linear-gradient(#000 0 0) content-box,
                linear-gradient(#000 0 0);
            mask-composite: exclude;
            -webkit-mask-composite: xor;
            padding: 10%;
            pointer-events: none;
            z-index: 9;
        }

        .scanner-section {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: #2d3748;
            border-radius: 12px;
            border: 1px solid #4a5568;
        }
        .scanner-section.active { display: block; }
        .btn-stop {
            background: #e53e3e;
            margin-top: 10px;
        }
        .btn-stop:hover { background: #c53030; }

        /* ====== КНОПКА ВСПЫШКИ ====== */
        #flash-btn {
            background: #718096;
            color: #fff;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            width: 100%;
            box-sizing: border-box;
            margin-top: 10px;
            transition: 0.2s;
        }
        #flash-btn:hover { background: #4a5568; }
        #flash-btn.active {
            background: #38a169;
            box-shadow: 0 0 15px rgba(56, 161, 105, 0.6);
        }
        #flash-btn:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
            opacity: 0.6;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🛡️ KONTRBOX VERIFY</h1>

    <div class="input-group">
        <input type="text" id="serial-input" placeholder="ВВЕДИТЕ СЕРИЙНЫЙ НОМЕР КОЛОНКИ">
        <button id="verify-btn" class="btn">Проверить подлинность</button>
        <button id="qr-btn" class="btn btn-secondary">📷 Открыть камеру (QR)</button>
    </div>

    <div id="scanner-section" class="scanner-section">
        <h3 style="margin-top: 0;">Сканирование QR-кода</h3>
        <div id="qr-reader"></div>
        <button id="flash-btn" disabled>🔦 Включить вспышку</button>
        <button id="qr-stop-btn" class="btn btn-stop">Остановить камеру</button>
    </div>

    <div id="result-container"></div>
</div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<script type="text/javascript">
document.addEventListener("DOMContentLoaded", function() {
    var verifyBtn = document.getElementById("verify-btn");
    var serialInput = document.getElementById("serial-input");
    var resultContainer = document.getElementById("result-container");
    var qrBtn = document.getElementById("qr-btn");
    var qrStopBtn = document.getElementById("qr-stop-btn");
    var scannerSection = document.getElementById("scanner-section");
    var qrReader = document.getElementById("qr-reader");
    var flashBtn = document.getElementById("flash-btn");
    var qrScanner = null;
    var cameraActive = false;
    var isFlashOn = false;

    // === Проверка подлинности ===
    if (verifyBtn) {
        verifyBtn.addEventListener("click", function() {
            runVerification();
        });
    }

    if (serialInput) {
        serialInput.addEventListener("keypress", function(e) {
            if (e.key === "Enter") runVerification();
        });
    }

    function runVerification() {
        if (!serialInput || !resultContainer) return;

        var inputVal = serialInput.value;
        var serialNumber = inputVal.replace(/^\s+|\s+$/g, "");

        if (serialNumber === "") {
            alert("Пожалуйста, введите серийный номер!");
            return;
        }

        if (serialNumber === "8602095001") {
            resultContainer.innerHTML = [
                '<div class="result-box success">',
                    '<p style="text-align: center; font-size: 16px; margin: 0 0 15px 0;"><b>🟢 Статус: Оригинальный продукт Kontrbox</b></p>',
                    '<p style="font-size: 15px; line-height: 1.6; text-align: justify; margin-bottom: 20px;">',
                        'Аудиосистема с указанным серийным номером является официальным оригиналом. Она полностью собрана по инженерным стандартам компании, прошла жесткий технический контроль звука и находится на фирменной гарантии.',
                    '</p>',
                    '<div style="background: #2d3748; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #4a5568;">',
                        '<p style="margin: 5px 0;"><b>Модель:</b> Контрбокс 0.1 (Kontrbox 0.1)</p>',
                        '<p style="margin: 5px 0;"><b>Серийный номер:</b> <span style="color: #48bb78; font-weight: bold;">' + serialNumber + '</span></p>',
                        '<p style="margin: 5px 0;"><b>Статус устройства:</b> Активно / Зарегистрировано в единой базе</p>',
                        '<p style="margin: 5px 0;"><b>Поддержка:</b> Доступно полное техническое сопровождение и гарантия</p>',
                    '</div>',
                    '<h3>📊 Полный лист технических характеристик</h3>',
                    '<h4>📐 Корпус и габариты</h4>',
                    '<ul class="specs-list">',
                        '<li><b>Форм-фактор:</b> Тяжелая премиальная аудиосистема 2.1</li>',
                        '<li><b>Длина (Глубина):</b> 380 мм</li>',
                        '<li><b>Ширина:</b> 200 мм</li>',
                        '<li><b>Высота:</b> 200 мм</li>',
                        '<li><b>Общий объем корпуса:</b> 15.2 литра</li>',
                        '<li><b>Тип сборки:</b> Кастомная инженерная конструкция с жестким демпфированием</li>',
                        '<li><b>Материал корпуса:</b> Сделано из дерева ✅</li>',
                    '</ul>',
                    '<h4>🔊 Реальная звуковая мощность</h4>',
                    '<ul class="specs-list">',
                        '<li><b>Номинальная чистая мощность:</b> 250 Вт RMS</li>',
                        '<li><b>Особенность звука:</b> Это честная, настоящая мощность аудиосистемы. Никаких завышенных цифр на коробке. Колонка выдает плотный, пробивающий тело бас и кристально чистый звук без искажений даже на максимальной громкости.</li>',
                        '<li><b>Тип аудиосистемы:</b> Трехканальный True Sound (2.1)</li>',
                        '<li><b>Низкочастотный динамик (Сабвуфер):</b> Профессиональный heavy вуфер AIYIMA 5.25 дюймов (4 Ом)</li>',
                        '<li><b>Широкополосные динамики (Каналы R/L):</b> Два мощных динамика по 4 дюйма для идеальной детализации средних и высоких частот</li>',
                    '</ul>',
                    '<h4>🧠 Усилитель и управление</h4>',
                    '<ul class="specs-list">',
                        '<li><b>Сердце системы:</b> Высокоэффективный цифровой усилитель ZK-HT21 на оригинальном мощном чипе TDA7498E</li>',
                        '<li><b>Беспроводная связь:</b> Bluetooth 5.0 (мгновенное подключение, стабильный сигнал, передача звука без потерь)</li>',
                        '<li><b>Проводное подключение:</b> Классический аудиовход AUX (3.5 мм) и USB-порт для воспроизведения музыки с флеш-карт</li>',
                        '<li><b>Аналоговая панель управления (Тонкая настройка):</b>',
                            '<br>• Регулятор частоты среза сабвуфера (Subwoofer Freq)',
                            '<br>• Регулятор индивидуальной громкости сабвуфера (Subwoofer Volume)',
                            '<br>• Регулятор высоких частот (Treble)',
                            '<br>• Регулятор низких частот (Bass)',
                            '<br>• Общий силовой регулятор громкости и питания (Main Volume)',
                        '</li>',
                    '</ul>',
                    '<h4>⚡ Электроника, питание и защита</h4>',
                    '<ul class="specs-list">',
                        '<li><b>Энергетическая база:</b> Мощная аккумуляторная сборка повышенной емкости 6S (номинальное рабочее напряжение 22.2 В — 24 В)</li>',
                        '<li><b>Система умной защиты (BMS):</b> Плата 6S 40A 12mos (полный контроль от перезаряда, глубокого разряда и коротких замыканий)</li>',
                        '<li><b>Индикация заряда:</b> Встроенный в корпус ЖК-экран с сочной зеленой подсветкой. Показывает точный процент оставшейся емкости аккумулятора (6S)</li>',
                        '<li><b>Органы управления:</b> Премиальная металлическая антивандальная кнопка питания 22 мм с круговой светодиодной LED-подсветкой и фиксацией положения</li>',
                        '<li><b>Порт зарядки:</b> Усиленное металлическое гнездо питания DC 5.5 x 2.1 мм, жестко зафиксированное в корпусе</li>',
                        '<li><b>Зарядное устройство:</b> Фирменный сетевой адаптер Li-ion 25.2 В, 2А для быстрой и безопасной закачки энергии в батарею</li>',
                    '</ul>',
                    '<h3 class="parts-title">📦 Архитектура оригинальных компонентов</h3>',
                    '<div class="part-card">',
                        '<h4>1. Низкочастотный вуфер AIYIMA 5.25" (4 Ом)</h4>',
                        '<img src="sub.png" alt="Сабвуфер AIYIMA">',
                        '<a class="part-link" href="https://www.aliexpress.com/item/1005006276498847.html" target="_blank">Открыть карточку компонента</a>',
                    '</div>',
                    '<div class="part-card">',
                        '<h4>2. Цифровой усилитель ZK-HT21 (TDA7498E)</h4>',
                        '<img src="amp.png" alt="Усилитель ZK-HT21">',
                        '<a class="part-link" href="https://www.aliexpress.com/item/1005006276498847.html" target="_blank">Открыть карточку компонента</a>',
                    '</div>',
                    '<div class="part-card">',
                        '<h4>3. Платa BMS 6S 40A 12mos</h4>',
                        '<img src="bms.png" alt="BMS 6S 40A">',
                        '<a class="part-link" href="https://www.aliexpress.com/item/1005006276498847.html" target="_blank">Открыть карточку компонента</a>',
                    '</div>',
                    '<div class="part-card">',
                        '<h4>4. Широкополосные динамики 4" (R/L каналы)</h4>',
                        '<img src="speakers.png" alt="Широкополосные динамики">',
                        '<a class="part-link" href="https://www.aliexpress.com/item/1005006276498847.html" target="_blank">Открыть карточку компонента</a>',
                    '</div>',
                '</div>'
            ].join('');
        } else {
            resultContainer.innerHTML = [
                '<div class="result-box error">',
                    '<p style="font-size: 18px; margin: 0;">🔴 Серийный номер не найден в базе</p>',
                    '<p style="font-size: 14px; margin: 10px 0 0 0; font-weight: normal;">',
                        'Устройство с номером <b>' + serialNumber + '</b> не зарегистрировано в официальной базе Kontrbox. ',
                        'Возможно, это подделка. Для уточнения информации свяжитесь с производителем.',
                    '</p>',
                '</div>'
            ].join('');
        }
    }

    // === Кнопка вспышки ===
    if (flashBtn) {
        flashBtn.addEventListener("click", function() {
            if (!qrScanner || !cameraActive) {
                alert("Сначала запустите камеру!");
                return;
            }
            if (qrScanner.isFlashSupported()) {
                qrScanner.toggleFlash(isFlashOn).then(function() {
                    isFlashOn = !isFlashOn;
                    if (isFlashOn) {
                        flashBtn.textContent = "🔦 Выключить вспышку";
                        flashBtn.classList.add("active");
                    } else {
                        flashBtn.textContent = "🔦 Включить вспышку";
                        flashBtn.classList.remove("active");
                    }
                }).catch(function(err) {
                    alert("Не удалось включить вспышку. Возможно, устройство не поддерживает.");
                });
            } else {
                alert("Вспышка не поддерживается на этом устройстве (iOS). Включите фонарик вручную.");
                flashBtn.disabled = true;
            }
        });
    }

    // === Сканирование QR-кода ===
    if (qrBtn) {
        qrBtn.addEventListener("click", function() {
            if (cameraActive) return;

            scannerSection.classList.add("active");
            if (flashBtn) flashBtn.disabled = true;

            // Проверяем, загрузилась ли библиотека
            if (typeof Html5Qrcode === "undefined") {
                alert("Библиотека сканера не загрузилась! Проверьте интернет.");
                scannerSection.classList.remove("active");
                return;
            }

            try {
                qrScanner = new Html5Qrcode("qr-reader");

                // ФИКС: qrbox теперь берёт размеры самого видео, а не окна
                var qrboxConfig = {
                    width: 250,
                    height: 250
                };

                // Используем функцию для динамического размера,
                // но с правильными параметрами от библиотеки
                function getDynamicQrbox(viewfinderWidth, viewfinderHeight) {
                    // Берём 70% от МЕНЬШЕЙ стороны ВИДЕО (не экрана!)
                    var minSide = Math.min(viewfinderWidth, viewfinderHeight);
                    var side = Math.round(minSide * 0.70);
                    // Минимум 150px, чтобы код точно читался
                    if (side < 150) side = 150;
                    console.log("Scan box:", side + "x" + side, "Video:", viewfinderWidth + "x" + viewfinderHeight);
                    return { width: side, height: side };
                }

                qrScanner.start(
                    { facingMode: "environment" },
                    {
                        fps: 10,
                        qrbox: getDynamicQrbox,
                        aspectRatio: 1.3333
                    },
                    function(decodedText) {
                        console.log("QR распознан:", decodedText);
                        serialInput.value = decodedText.trim();
                        stopCamera();
                        runVerification();
                    },
                    function(errorMessage) {
                        // Ошибки сканирования идут постоянно — это нормально
                    }
                ).then(function() {
                    cameraActive = true;
                    if (flashBtn) flashBtn.disabled = false;
                    console.log("Камера запущена успешно");
                }).catch(function(err) {
                    console.error("Ошибка запуска:", err);
                    alert("Не удалось получить доступ к камере.\n\nВозможные причины:\n1. Нет доступа к камере\n2. Сайт открыт не по HTTPS\n\nОшибка: " + err);
                    scannerSection.classList.remove("active");
                });
            } catch (e) {
                console.error("Ошибка инициализации:", e);
                alert("Ошибка сканера: " + e.message);
                scannerSection.classList.remove("active");
            }
        });
    }

    if (qrStopBtn) {
        qrStopBtn.addEventListener("click", function() {
            stopCamera();
        });
    }

    function stopCamera() {
        if (qrScanner && cameraActive) {
            qrScanner.stop().then(function() {
                cameraActive = false;
                scannerSection.classList.remove("active");
                qrReader.innerHTML = "";
                if (flashBtn) {
                    flashBtn.disabled = true;
                    flashBtn.textContent = "🔦 Включить вспышку";
                    flashBtn.classList.remove("active");
                    isFlashOn = false;
                }
            }).catch(function() {
                cameraActive = false;
                scannerSection.classList.remove("active");
                qrReader.innerHTML = "";
            });
        } else {
            scannerSection.classList.remove("active");
        }
    }
});
</script>

</body>
</html>
