</head>
<body>

<div class="container">
    <h1>🛡️ KONTRBOX VERIFY</h1>
    
    <div class="input-group">
        <!-- Событие onclick="toggleScan()" управляет запуском и остановкой камеры -->
        <button id="scan-btn" onclick="toggleScan()">📷 Включить сканер штрих-кода</button>
        <div id="reader"></div>
        
        <input type="text" id="serial-input" placeholder="ВВЕДИТЕ СЕРИЙНЫЙ НОМЕР КОЛОНКИ">
        <!-- Событие onclick="runVerification()" запускает проверку номера -->
        <button onclick="runVerification()">Проверить подлинность</button>
    </div>

    <div id="result-container"></div>
</div>

<script>
let html5QrcodeScanner = null;
let isScanning = false;

// Умная функция: включает или выключает сканер при нажатии на одну кнопку
function toggleScan() {
    const scanBtn = document.getElementById('scan-btn');
    
    if (isScanning) {
        stopScan();
    } else {
        startRealScan();
    }
}
// Запуск камеры смартфона
function startRealScan() {
    const scanBtn = document.getElementById('scan-btn');
    isScanning = true;
    scanBtn.innerText = "🛑 Остановить сканер";
    scanBtn.style.background = "#e53e3e";

    html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
        fps: 15, 
        qrbox: { width: 280, height: 160 } 
    }, false);
    
    html5QrcodeScanner.render(onScanSuccess, onScanFailure);
}

// Принудительная остановка сканера
function stopScan() {
    const scanBtn = document.getElementById('scan-btn');
    if (html5QrcodeScanner) {
        html5QrcodeScanner.clear().then(() => {
            isScanning = false;
            scanBtn.innerText = "📷 Включить сканер штрих-кода";
            scanBtn.style.background = "#3182ce";
        }).catch(err => {
            console.error("Ошибка при остановке сканера: ", err);
        });
    }
}

// Если сканер успешно считал штрих-код
function onScanSuccess(decodedText, decodedResult) {
    document.getElementById('serial-input').value = decodedText;
    stopScan(); // Мягко отключаем камеру
    runVerification(); // Сразу запускаем проверку номера
}

function onScanFailure(error) {
    // В процессе поиска кодов ошибки не выводим
}

        return;
    }

                    <p style="margin: 5px 0;"><b>Модель:</b> Контрбокс 0.1 (Kontrbox 0.1)</p>
                    <p style="margin: 5px 0;"><b>Серийный номер:</b> <span id="res-sn" style="color: #48bb78; font-weight: bold;"></span></p>
                    <p style="margin: 5px 0;"><b>Статус устройства:</b> Активно / Зарегистрировано в единой базе</p>
                    <p style="margin: 5px 0;"><b>Поддержка:</b> Доступно полное техническое сопровождение и гарантия</p>
                </div>

                <h3>📊 Полный лист технических характеристик</h3>
                
                <h4>📐 Корпус и габариты</h4>
                <ul class="specs-list">
                    <li><b>Форм-фактор:</b> Тяжелая премиальная аудиосистема 2.1</li>
                    <li><b>Длина (Глубина):</b> 380 мм</li>
