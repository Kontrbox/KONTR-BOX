<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes">
    <title>Kontrbox Verify</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0e121a; color: #e2e8f0; margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }
        .container {
            max-width: 500px; width: 100%; background: #1a202c;
            padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #2d3748;
        }
        h1 {
            text-align: center; font-size: 24px; margin-bottom: 25px;
            color: #fff; text-transform: uppercase; letter-spacing: 2px;
        }
        input[type="text"] {
            padding: 18px; background: #2d3748; border: 2px solid #4a5568;
            border-radius: 12px; font-size: 16px; color: #fff; outline: none;
            text-align: center; font-weight: bold; width: 100%; letter-spacing: 1px;
        }
        input[type="text"]:focus { border-color: #38a169; }
        .btn {
            text-align: center; display: block; border: none; padding: 18px;
            font-size: 16px; font-weight: bold; border-radius: 12px; cursor: pointer;
            transition: 0.2s; text-transform: uppercase; width: 100%;
        }
        .btn-verify { background: #38a169; color: white; }
        .btn-verify:hover { background: #2f855a; }
        .btn-qr { background: #4a5568; color: white; margin-top: 15px; }
        .btn-qr:hover { background: #718096; }

        #camera-input { display: none; }
        label[for="camera-input"] { display: block; }

        .preview-area {
            margin-top: 20px; display: none; text-align: center;
        }
        .preview-img {
            max-width: 100%; border-radius: 12px; border: 2px solid #38a169;
        }

        .result-box {
            display: none; margin-top: 20px; padding: 20px;
            border-radius: 12px; border: 2px solid transparent;
            text-align: center; font-weight: bold;
        }
        .success { display: block; border-color: #38a169; background: #1c4532; color: #fff; }
        .error { display: block; border-color: #e53e3e; background: #652b2b; color: #fed7d7; }

        /* Рамка для наведения на QR при фото */
        .scan-guide {
            position: relative;
            width: 80%; max-width: 320px; aspect-ratio: 1;
            border: 4px solid #38a169; border-radius: 8px;
            margin: 30px auto 15px;
            box-shadow: 0 0 20px rgba(56, 161, 105, 0.4);
        }
        .scan-hint {
            text-align: center; color: #a0aec0; font-size: 13px;
            line-height: 1.4; margin-top: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🛡️ KONTRBOX VERIFY</h1>

    <!-- Подсказка, куда класть QR -->
    <div class="scan-guide"></div>
    <p class="scan-hint">
        Наведите рамку на QR-код при фотографировании.<br>
        На iPhone вспышка включается в родной камере.
    </p>

    <input type="text" id="serial-input" placeholder="СЕРИЙНЫЙ НОМЕР">
    <button id="verify-btn" class="btn btn-verify">Проверить подлинность</button>

    <label for="camera-input" class="btn btn-qr">📷 Сфоткать QR-код</label>
    <input type="file" id="camera-input" accept="image/*" capture="environment">

    <div id="photo-preview" class="preview-area">
        <img id="photo-img" class="preview-img" src="" alt="QR фото">
    </div>

    <div id="result-container"></div>
</div>

<!-- Библиотека для чтения QR с фото -->
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const verifyBtn = document.getElementById("verify-btn");
    const serialInput = document.getElementById("serial-input");
    const resultContainer = document.getElementById("result-container");
    const cameraInput = document.getElementById("camera-input");
    const photoPreview = document.getElementById("photo-preview");
    const photoImg = document.getElementById("photo-img");

    function checkSerial(serial) {
        if (!serial) return;
        const s = serial.trim();
        if (s === "8602095001") {
            resultContainer.innerHTML = `
                <div class="result-box success">
                    <p>🟢 Оригинальный продукт Kontrbox</p>
                    <p style="font-size:14px; color:#cbd5e0; margin-top:8px;">
                        Устройство зарегистрировано в базе.
                    </p>
                </div>`;
        } else {
            resultContainer.innerHTML = `
                <div class="result-box error">
                    <p>🔴 Серийный номер не найден</p>
                    <p style="font-size:14px; color:#fed7d7; margin-top:8px;">
                        Проверьте правильность ввода или отсканируйте QR заново.
                    </p>
                </div>`;
        }
    }

    if (verifyBtn) verifyBtn.addEventListener("click", () => checkSerial(serialInput.value));
    if (serialInput) serialInput.addEventListener("keypress", e => { if (e.key === "Enter") checkSerial(serialInput.value); });

    cameraInput.addEventListener("change", function(e) {
        const file = e.target.files[0];
        if (!file) return;

        photoPreview.style.display = "block";
        const url = URL.createObjectURL(file);
        photoImg.src = url;

        const img = new Image();
        img.onload = function() {
            const canvas = document.createElement("canvas");
            const ctx = canvas.getContext("2d");
            canvas.width = img.width;
            canvas.height = img.height;
            ctx.drawImage(img, 0, 0);
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

            const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "attemptBoth" });
            if (code && code.data) {
                serialInput.value = code.data.trim();
                checkSerial(code.data.trim());
            } else {
                resultContainer.innerHTML = `
                    <div class="result-box error">
                        <p>❌ QR не распознан</p>
                        <p style="font-size:13px; color:#fed7d7;">
                            Сфотографируйте чётче, держите QR ровно в рамке, без бликов.
                        </p>
                    </div>`;
            }
            URL.revokeObjectURL(url);
        };
        img.src = url;
    });
});
</script>
</body>
</html>
